name: MCME-PVP
main: com.mcmiddleearth.pvp.PvpPlugin
version: ${project.version}
api-version: '26.2'
description: PvP game modes for MCME; several games can run at once.
authors: [DonoA, aaldim, lizzehface, meggawatts, Eriol_Eandur, NicoviçTheSixth, barteldvn, Jubo]
# Multiverse-Core, when present, loads the arena worlds first, with its own generator and environment settings;
# WorldSetup then only switches immediate respawn on. A softdepend on a plugin that isn't installed is ignored.
softdepend: [PlaceholderAPI, Multiverse-Core]

# /pvp, /pvpadmin and /t are registered at runtime through Paper's Brigadier API.
permissions:
  pvp.play:
    description: Join, leave and spectate games; see rules and stats; team chat.
    default: true
  pvp.join.locked:
    description: Stay on the server while PvP is locked.
    default: op
  pvp.staff.run:
    description: Open, count down and stop games; lock and unlock PvP; send everyone to the main server.
    default: op
  pvp.staff.kick:
    description: Send one player to the main server.
    default: op
  pvp.staff.arena:
    description: List, inspect and re-import arenas.
    default: op
  pvp.admin:
    description: Everything. Also shows the "PvP Staff" chat prefix.
    default: op
    children:
      pvp.play: true
      pvp.join.locked: true
      pvp.staff.run: true
      pvp.staff.kick: true
      pvp.staff.arena: true
  # 1.1.2 nodes: kept as parents of the new ones, so existing LuckPerms grants and groups keep working.
  pvp.join:
    description: 1.1.2 node; grants pvp.join.locked.
    default: op
    children:
      pvp.join.locked: true
  pvp.gameKick:
    description: 1.1.2 node; grants pvp.staff.kick.
    default: op
    children:
      pvp.staff.kick: true
  pvp.gameCanRun:
    description: 1.1.2 node; grants pvp.staff.run.
    default: op
    children:
      pvp.staff.run: true
  pvp.mapCreate:
    description: 1.1.2 node; grants pvp.staff.arena.
    default: op
    children:
      pvp.staff.arena: true
  pvp.adminPermission:
    description: 1.1.2 node; grants pvp.admin.
    default: op
    children:
      pvp.admin: true
  pvp.builder:
    description: 1.1.2 group node.
    children:
      pvp.join: true
  pvp.moderator:
    description: 1.1.2 group node.
    children:
      pvp.gameKick: true
  pvp.manager:
    description: 1.1.2 group node.
    children:
      pvp.gameCanRun: true
      pvp.join: true
      pvp.moderator: true
